[platformio]
default_envs = seeed_xiao_esp32s3

; Optional debug flags for build_flags:
;   -DTEST_EMIT           emit fake detections on Serial1 every 3 s, to verify
;                         the XIAO -> Heltec UART path without a live drone.
;   -DMIRROR_LINK_TO_USB  also print each link JSON line to USB serial, so the
;                         exact bytes sent to the display can be inspected
;                         without the Heltec attached.
[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^6.18.5
