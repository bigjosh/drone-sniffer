; Bench test transmitter — broadcasts a synthetic Remote ID beacon so the
; sniffer can be validated without a real drone. Not for use outside the bench.
[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
; WiFi + BLE stacks together exceed the default 1.25 MB app partition.
board_build.partitions = huge_app.csv
; Serial goes out UART0 to the CP210x bridge, not native USB CDC.
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0
